<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="clinicBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081419"/>
      <stop offset="0.5" stop-color="#0f232b"/>
      <stop offset="1" stop-color="#163840"/>
    </linearGradient>
    <linearGradient id="clinicCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12242e"/>
      <stop offset="1" stop-color="#0d1b22"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ecfc0"/>
      <stop offset="1" stop-color="#4ae3c8"/>
    </linearGradient>
    <filter id="clinicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#clinicBg)"/>

  <!-- Grid mesh -->
  <path d="M100 200h1400M100 400h1400M100 600h1400M100 800h1400M300 100v800M600 100v800M900 100v800M1200 100v800"
        stroke="#1a353f" stroke-width="1.5" opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Title -->
  <text x="800" y="110" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="8" font-weight="600">GURUDATTA CLINIC MANAGEMENT</text>
  <text x="800" y="145" text-anchor="middle" fill="#8ca0aa" font-family="'Instrument Sans', sans-serif" font-size="16" letter-spacing="3">ANDROID SDK (JAVA) · SQLITE PERSISTENCE · 200+ PATIENT RECORDS</text>

  <!-- Left: Android Device Mockup -->
  <rect x="220" y="200" width="360" height="700" rx="46" fill="#0c181f" stroke="#3ecfc0" stroke-width="3" filter="url(#clinicGlow)"/>
  <rect x="236" y="216" width="328" height="668" rx="36" fill="#081014"/>
  <!-- Phone Notch & Speaker -->
  <rect x="330" y="228" width="140" height="20" rx="10" fill="#14242d"/>
  <circle cx="450" cy="238" r="4" fill="#3ecfc0" opacity="0.8"/>

  <!-- Mobile Top Bar with Medical Cross -->
  <rect x="236" y="260" width="328" height="65" fill="#10232c"/>
  <rect x="260" y="278" width="28" height="28" rx="6" fill="#3ecfc0"/>
  <path d="M274 284v16M266 292h16" stroke="#081014" stroke-width="3.5" stroke-linecap="round"/>
  <text x="300" y="297" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="bold">Gurudatta Clinic</text>
  <text x="300" y="313" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="10">DR. AUTHENTICATED</text>

  <!-- Patient Search Box -->
  <rect x="256" y="340" width="288" height="42" rx="10" fill="#142732" stroke="#234250" stroke-width="1"/>
  <text x="276" y="366" fill="#6d8a96" font-family="'Instrument Sans', sans-serif" font-size="13">🔍 Search patient name / ID...</text>

  <!-- Quick Action Buttons in App -->
  <rect x="256" y="396" width="138" height="75" rx="12" fill="#132a35" stroke="#3ecfc0" stroke-width="1" stroke-opacity="0.4"/>
  <text x="272" y="426" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">+ NEW</text>
  <text x="272" y="450" fill="#a4bdc6" font-family="'Instrument Sans', sans-serif" font-size="12">Add Patient</text>

  <rect x="406" y="396" width="138" height="75" rx="12" fill="#132a35" stroke="#3ecfc0" stroke-width="1" stroke-opacity="0.4"/>
  <text x="422" y="426" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">24</text>
  <text x="422" y="450" fill="#a4bdc6" font-family="'Instrument Sans', sans-serif" font-size="12">Today's Visits</text>

  <!-- Mobile Patient List Cards -->
  <rect x="256" y="488" width="288" height="80" rx="14" fill="#11222b"/>
  <circle cx="286" cy="528" r="18" fill="#193744"/>
  <text x="286" y="534" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">P1</text>
  <text x="316" y="522" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600">Ramesh Jadhav</text>
  <text x="316" y="542" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="11">Age 48 · BP Checkup</text>
  <rect x="475" y="515" width="55" height="24" rx="12" fill="#3ecfc0" fill-opacity="0.15"/>
  <text x="502" y="531" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="10">10:30</text>

  <rect x="256" y="580" width="288" height="80" rx="14" fill="#11222b"/>
  <circle cx="286" cy="620" r="18" fill="#193744"/>
  <text x="286" y="626" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">P2</text>
  <text x="316" y="614" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600">Sunita Kulkarni</text>
  <text x="316" y="634" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="11">Age 35 · Blood Test Followup</text>
  <rect x="475" y="607" width="55" height="24" rx="12" fill="#3ecfc0" fill-opacity="0.15"/>
  <text x="502" y="623" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="10">11:15</text>

  <rect x="256" y="672" width="288" height="80" rx="14" fill="#11222b"/>
  <circle cx="286" cy="712" r="18" fill="#193744"/>
  <text x="286" y="718" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">P3</text>
  <text x="316" y="706" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600">Anil Patil</text>
  <text x="316" y="726" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="11">Age 52 · Prescription Renewal</text>
  <rect x="475" y="699" width="55" height="24" rx="12" fill="#e29d52" fill-opacity="0.15"/>
  <text x="502" y="715" text-anchor="middle" fill="#e29d52" font-family="'JetBrains Mono', monospace" font-size="10">12:00</text>

  <!-- Right: Architecture / SQLite System Panel -->
  <rect x="630" y="200" width="750" height="700" rx="24" fill="url(#clinicCard)" stroke="#3ecfc0" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Right Header -->
  <rect x="630" y="200" width="750" height="60" rx="24" fill="#0b171e"/>
  <text x="670" y="238" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="18" font-weight="600">Local Relational Architecture &amp; Clinical Workflow</text>
  <rect x="1220" y="215" width="130" height="30" rx="15" fill="#3ecfc0" fill-opacity="0.15" stroke="#3ecfc0" stroke-width="1"/>
  <text x="1285" y="235" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">95% PAPERLESS</text>

  <!-- Stat Cards -->
  <rect x="670" y="285" width="210" height="110" rx="16" fill="#13232c" stroke="#254250" stroke-width="1.5"/>
  <text x="695" y="320" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="13">TOTAL PATIENTS</text>
  <text x="695" y="370" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold">200+</text>

  <rect x="900" y="285" width="210" height="110" rx="16" fill="#13232c" stroke="#254250" stroke-width="1.5"/>
  <text x="925" y="320" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="13">PRESCRIPTIONS</text>
  <text x="925" y="370" fill="#5de09a" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold">850+</text>

  <rect x="1130" y="285" width="210" height="110" rx="16" fill="#13232c" stroke="#254250" stroke-width="1.5"/>
  <text x="1155" y="320" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="13">SQLITE LATENCY</text>
  <text x="1155" y="370" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold">&lt;12ms</text>

  <!-- SQLite Schema / Query Block -->
  <rect x="670" y="425" width="670" height="440" rx="18" fill="#0a141a" stroke="#1d3844" stroke-width="1.5"/>
  <rect x="670" y="425" width="670" height="45" rx="18" fill="#102028"/>
  <circle cx="700" cy="448" r="6" fill="#e05d5d"/>
  <circle cx="720" cy="448" r="6" fill="#e0a85d"/>
  <circle cx="740" cy="448" r="6" fill="#5de09a"/>
  <text x="765" y="453" fill="#6d8a96" font-family="'JetBrains Mono', monospace" font-size="13">database_helper.sql · SQLite Schema &amp; Indexed Views</text>

  <!-- SQL Code Snippet Highlighting -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" xml:space="preserve">
    <text x="700" y="505" fill="#3ecfc0">CREATE TABLE</text> <text x="815" y="505" fill="#ffffff">patients (</text>
    <text x="730" y="535" fill="#758e9b">id</text> <text x="760" y="535" fill="#e29d52">INTEGER PRIMARY KEY AUTOINCREMENT,</text>
    <text x="730" y="565" fill="#758e9b">name</text> <text x="775" y="565" fill="#5de09a">TEXT NOT NULL,</text>
    <text x="730" y="595" fill="#758e9b">phone</text> <text x="785" y="595" fill="#5de09a">TEXT UNIQUE,</text>
    <text x="730" y="625" fill="#758e9b">medical_history</text> <text x="875" y="625" fill="#5de09a">TEXT,</text>
    <text x="730" y="655" fill="#758e9b">created_at</text> <text x="830" y="655" fill="#e29d52">TIMESTAMP DEFAULT CURRENT_TIMESTAMP</text>
    <text x="700" y="685" fill="#ffffff">);</text>

    <text x="700" y="730" fill="#3ecfc0">CREATE INDEX</text> <text x="815" y="730" fill="#ffffff">idx_patient_search </text> <text x="1000" y="730" fill="#3ecfc0">ON</text> <text x="1030" y="730" fill="#ffffff">patients(phone, name);</text>

    <text x="700" y="780" fill="#758e9b">-- Structured SDLC deployment for Dr. Gurudatta</text>
    <text x="700" y="810" fill="#758e9b">-- Relational optimization guarantees instantaneous search on low-end Android hardware</text>
    <text x="700" y="840" fill="#3ecfc0">✓ Production verified at clinic site</text>
  </g>
</svg>
