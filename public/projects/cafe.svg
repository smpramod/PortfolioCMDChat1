  <text x="1140" y="322" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="11">REWARDS: 450 PTS ★</text>

  <!-- Mobile Hero Card -->
  <rect x="1135" y="340" width="250" height="150" rx="18" fill="url(#cardBg)" stroke="#3ecfc0" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="1185" cy="400" r="30" fill="#3ecfc0" fill-opacity="0.15"/>
  <path d="M1175 390h20v18c0 5-4 9-9 9h-2c-5 0-9-4-9-9v-18zM1195 395h6c3 0 5 2 5 5s-2 5-5 5h-6" stroke="#3ecfc0" stroke-width="2.5" fill="none"/>
  <text x="1235" y="395" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="16" font-weight="600">Fast Order</text>
  <text x="1235" y="415" fill="#758e9b" font-family="'Instrument Sans', sans-serif" font-size="12">Order ahead &amp; collect</text>
  <rect x="1235" y="435" width="120" height="30" rx="15" fill="url(#warmGrad)"/>
  <text x="1295" y="454" text-anchor="middle" fill="#091317" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ORDER NOW</text>

  <!-- Mobile Menu item 1 -->
  <rect x="1135" y="510" width="250" height="70" rx="14" fill="#12232c"/>
  <circle cx="1165" cy="545" r="18" fill="#1b3642"/>
  <text x="1195" y="540" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600">Signature Roast</text>
  <text x="1195" y="560" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="13">₹220</text>

  <!-- Mobile Menu item 2 -->
  <rect x="1135" y="595" width="250" height="70" rx="14" fill="#12232c"/>
  <circle cx="1165" cy="630" r="18" fill="#1b3642"/>
  <text x="1195" y="625" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="14" font-weight="600">Almond Croissant</text>
  <text x="1195" y="645" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="13">₹180</text>

  <!-- Mobile Floating Order Tracker Badge -->
  <rect x="1135" y="685" width="250" height="90" rx="16" fill="#162e3b" stroke="#3ecfc0" stroke-width="1.5"/>
  <circle cx="1165" cy="730" r="16" fill="#3ecfc0"/>
  <text x="1165" y="736" text-anchor="middle" fill="#091317" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">✓</text>
  <text x="1195" y="722" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="600">Order #BW-8821</text>
  <text x="1195" y="742" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="11">Brewing in Kitchen...</text>
</svg>
