<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b161c"/>
      <stop offset="0.5" stop-color="#12252e"/>
      <stop offset="1" stop-color="#1a3b3e"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11222b"/>
      <stop offset="1" stop-color="#0d1b22"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ecfc0"/>
      <stop offset="1" stop-color="#5fe5d6"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e29d52"/>
      <stop offset="1" stop-color="#f2b46d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Subtle circuit/grid mesh -->
  <path d="M100 200h1400M100 400h1400M100 600h1400M100 800h1400M300 100v800M600 100v800M900 100v800M1200 100v800"
        stroke="#1d3a46" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 6"/>

  <!-- Title / Kicker -->
  <text x="800" y="110" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="8" font-weight="600">BLACK &amp; WHITE CAFE PLATFORM</text>
  <text x="800" y="145" text-anchor="middle" fill="#8ca0aa" font-family="'Instrument Sans', sans-serif" font-size="16" letter-spacing="3">FLUTTER MOBILE · NEXT.JS WEB · NESTJS &amp; SOCKET.IO</text>

  <!-- Main Web Dashboard Window -->
  <rect x="180" y="190" width="860" height="660" rx="24" fill="url(#cardBg)" stroke="#3ecfc0" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Window Header -->
  <rect x="180" y="190" width="860" height="60" rx="24" fill="#0c171e"/>
  <circle cx="220" cy="220" r="7" fill="#e05d5d"/>
  <circle cx="245" cy="220" r="7" fill="#e0a85d"/>
  <circle cx="270" cy="220" r="7" fill="#5de09a"/>
  <rect x="330" y="205" width="380" height="30" rx="8" fill="#152731"/>
  <text x="520" y="225" text-anchor="middle" fill="#678492" font-family="'JetBrains Mono', monospace" font-size="13">api.blackandwhitecafe.com/orders/stream</text>
  <rect x="880" y="205" width="130" height="30" rx="15" fill="#3ecfc0" fill-opacity="0.15" stroke="#3ecfc0" stroke-width="1"/>
  <circle cx="900" cy="220" r="4" fill="#3ecfc0" filter="url(#glow)"/>
  <text x="955" y="225" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">LIVE SOCKET</text>

  <!-- Dashboard Metrics Row -->
  <rect x="220" y="280" width="240" height="110" rx="16" fill="#13232c" stroke="#254250" stroke-width="1.5"/>
  <text x="245" y="315" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="13">ACTIVE ORDERS</text>
  <text x="245" y="365" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold">38</text>
  <text x="315" y="365" fill="#5de09a" font-family="'JetBrains Mono', monospace" font-size="14">+14% peak</text>

  <rect x="490" y="280" width="240" height="110" rx="16" fill="#13232c" stroke="#254250" stroke-width="1.5"/>
  <text x="515" y="315" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="13">AVG WAIT TIME</text>
  <text x="515" y="365" fill="#e29d52" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold">4.2m</text>
  <text x="615" y="365" fill="#5de09a" font-family="'JetBrains Mono', monospace" font-size="14">-28% vs avg</text>

  <rect x="760" y="280" width="240" height="110" rx="16" fill="#13232c" stroke="#254250" stroke-width="1.5"/>
  <text x="785" y="315" fill="#758e9b" font-family="'JetBrains Mono', monospace" font-size="13">LOYALTY CLAIMS</text>
  <text x="785" y="365" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold">124</text>
  <text x="870" y="365" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="14">pts synced</text>

  <!-- Live Order Queue Table -->
  <rect x="220" y="420" width="780" height="390" rx="18" fill="#0f1c24" stroke="#1d3844" stroke-width="1.5"/>
  <text x="250" y="460" fill="#ffffff" font-family="'Instrument Sans', sans-serif" font-size="18" font-weight="600">Live Kitchen Dispatch &amp; Room Events</text>

  <!-- Order Row 1 -->
  <rect x="245" y="485" width="730" height="64" rx="12" fill="#142631"/>
  <text x="270" y="523" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">#BW-8821</text>
  <text x="385" y="523" fill="#d2e0e6" font-family="'Instrument Sans', sans-serif" font-size="15">Caramel Macchiato × 2, Avocado Toast</text>
  <rect x="730" y="503" width="110" height="28" rx="14" fill="#3ecfc0" fill-opacity="0.2"/>
  <text x="785" y="522" text-anchor="middle" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">PREPARING</text>
  <text x="930" y="523" text-anchor="end" fill="#7d95a2" font-family="'JetBrains Mono', monospace" font-size="13">Table 06</text>

  <!-- Order Row 2 -->
  <rect x="245" y="565" width="730" height="64" rx="12" fill="#142631"/>
  <text x="270" y="603" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">#BW-8820</text>
  <text x="385" y="603" fill="#d2e0e6" font-family="'Instrument Sans', sans-serif" font-size="15">Iced Americano, Croissant, Espresso Double</text>
  <rect x="730" y="583" width="110" height="28" rx="14" fill="#e29d52" fill-opacity="0.2"/>
  <text x="785" y="602" text-anchor="middle" fill="#e29d52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">READY</text>
  <text x="930" y="603" text-anchor="end" fill="#7d95a2" font-family="'JetBrains Mono', monospace" font-size="13">Guest #19</text>

  <!-- Order Row 3 -->
  <rect x="245" y="645" width="730" height="64" rx="12" fill="#142631"/>
  <text x="270" y="683" fill="#3ecfc0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold">#BW-8819</text>
  <text x="385" y="683" fill="#d2e0e6" font-family="'Instrument Sans', sans-serif" font-size="15">Cold Brew Latte with Oat Milk</text>
  <rect x="730" y="663" width="110" height="28" rx="14" fill="#5de09a" fill-opacity="0.2"/>
  <text x="785" y="682" text-anchor="middle" fill="#5de09a" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">SERVED</text>
  <text x="930" y="683" text-anchor="end" fill="#7d95a2" font-family="'JetBrains Mono', monospace" font-size="13">Takeaway</text>

  <!-- Mobile App Frame (Flutter Side) -->
  <rect x="1100" y="220" width="320" height="620" rx="42" fill="#0b171e" stroke="#5fe5d6" stroke-width="3" filter="url(#glow)"/>
  <rect x="1115" y="235" width="290" height="590" rx="32" fill="#081014"/>
